<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Ghibli Masterpiece Edition</title>
    <!-- Google Fonts: Ghibli Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #0b1329;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTAINER UTAMA (Gaya Ghibli World) --- */
        #game-container {
            position: relative;
            width: 900px;
            height: 550px;
            background: linear-gradient(to bottom, #7fc1bb, #d8f3dc);
            border: 6px solid #2d312e;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        /* 1. AWAN CAT AIR BERGERAK HALUS */
        .ghibli-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 120px;
            filter: blur(1px);
            animation: floatCloud linear infinite;
            z-index: 1;
        }
        .ghibli-cloud::before, .ghibli-cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
        }
        .gc-1 { width: 160px; height: 45px; top: 35px; left: -180px; animation-duration: 50s; }
        .gc-1::before { width: 60px; height: 60px; top: -30px; left: 25px; }
        .gc-1::after { width: 80px; height: 80px; top: -45px; left: 70px; }

        .gc-2 { width: 110px; height: 35px; top: 90px; left: -220px; animation-duration: 38s; animation-delay: 12s; }
        .gc-2::before { width: 45px; height: 45px; top: -22px; left: 18px; }
        .gc-2::after { width: 55px; height: 55px; top: -32px; left: 42px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(1150px); }
        }

        /* 2. BUKIT HIJAU BERLAPIS ALA PEDESAAN GHIBLI */
        .hill-far {
            position: absolute;
            bottom: 160px;
            left: -80px;
            width: 1050px;
            height: 280px;
            background: #608c56;
            border-radius: 50% 50% 0 0;
            z-index: 2;
            opacity: 0.85;
        }
        .hill-near {
            position: absolute;
            bottom: 125px;
            right: -120px;
            width: 750px;
            height: 240px;
            background: #4d7c3f;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }

        /* Pohon Rimbun Estetik */
        .ghibli-tree {
            position: absolute;
            bottom: 215px;
            z-index: 3;
        }
        .trunk {
            width: 18px;
            height: 65px;
            background: #5c4033;
            margin: 0 auto;
            border-radius: 6px;
        }
        .leaves {
            width: 95px;
            height: 105px;
            background: #2b4d27;
            border-radius: 50%;
            position: absolute;
            top: -60px;
            left: -38px;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.2);
        }
        .gt-1 { left: 90px; }
        .gt-2 { right: 70px; bottom: 240px; transform: scale(0.75); }

        /* 3. SUNGAI TENANG, DAMAI, DAN ARUS SANGAT HALUS */
        .river-bed {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 155px;
            background: linear-gradient(to bottom, #2a9d8f, #264653);
            z-index: 4;
            overflow: hidden;
            border-top: 4px solid #8ab17d;
        }

        .water-wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
        }
        /* Durasi diperlambat drastis jadi 12s & 16s agar arusnya tenang banget */
        .ww-1 {
            background: radial-gradient(circle, #48cae4 10%, transparent 11%);
            background-size: 50px 25px;
            top: 10px;
            opacity: 0.4;
            animation: waterFlowSlow1 12s linear infinite;
        }
        .ww-2 {
            background: radial-gradient(circle, #ade8f4 8%, transparent 9%);
            background-size: 70px 35px;
            top: 25px;
            opacity: 0.25;
            animation: waterFlowSlow2 16s linear infinite;
        }
        @keyframes waterFlowSlow1 {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes waterFlowSlow2 {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* 4. JEMBATAN KAYU LENGKUNG KLASIK */
        #bridge-wrapper {
            position: absolute;
            bottom: 85px;
            left: 140px;
            width: 290px;
            height: 115px;
            z-index: 5;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left bottom;
        }

        .classic-arch {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .arch-deck {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 72px;
            background: #8d5b4c;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            border-top: 6px solid #d4a373;
            box-shadow: 0 12px 20px rgba(0,0,0,0.35);
        }
        .arch-rail {
            position: absolute;
            top: -16px;
            width: 100%;
            height: 42px;
            border-top: 5px solid #582f1d;
        }
        .p-post {
            position: absolute;
            width: 8px;
            height: 48px;
            background: #582f1d;
            bottom: 0;
            border-radius: 3px;
        }
        .pp1 { left: 12px; }
        .pp2 { left: 82px; height: 55px; top: -7px; }
        .pp3 { left: 142px; height: 58px; top: -10px; }
        .pp4 { left: 202px; height: 55px; top: -7px; }
        .pp5 { left: 270px; }

        /* Karakter Ghibli dengan Animasi Jalan di Atas Jembatan */
        #character {
            position: absolute;
            bottom: 98px;
            left: 70px; /* Posisi awal di seberang kiri */
            width: 38px;
            height: 58px;
            background: linear-gradient(135deg, #e76f51, #d44d31);
            border-radius: 16px 16px 6px 6px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #character::after {
            content: '';
            position: absolute;
            top: -11px;
            left: 7px;
            width: 24px;
            height: 24px;
            background: #ffecd1;
            border-radius: 50%;
        }

        /* --- STATE POSISI & ANIMASI KARAKTER & JEMBATAN --- */
        /* Posisi Start / Reset */
        #game-container.pos-start #character {
            left: 70px;
            transform: translateY(0) rotate(0deg);
        }

        /* Posisi Maju 1 (Benar 1 / Salah 1) */
        #game-container.pos-step1 #character {
            left: 140px;
            transform: translateY(-8px) rotate(-3deg);
            animation: walkBounce 0.4s ease infinite alternate;
        }
        #game-container.pos-step1 #bridge-wrapper {
            transform: rotate(-4deg) translateY(6px);
        }

        /* Posisi Maju 2 (Benar 2 / Salah 2) */
        #game-container.pos-step2 #character {
            left: 210px;
            transform: translateY(-15px) rotate(-8deg);
            animation: walkBounce 0.4s ease infinite alternate;
        }
        #game-container.pos-step2 #bridge-wrapper {
            transform: rotate(-14deg) translateY(20px);
        }

        /* Posisi Sukses / Menang di Seberang Kanan */
        #game-container.pos-win #character {
            left: 285px;
            transform: translateY(0) rotate(0deg);
            animation: celebrateJump 0.6s ease infinite alternate;
        }
        #game-container.pos-win #bridge-wrapper {
            transform: rotate(0deg) translateY(0);
        }

        /* Animasi Langkah Kaki Menggemaskan */
        @keyframes walkBounce {
            0% { transform: translateY(var(--ty, 0)) rotate(var(--rot, 0deg)) translateY(0); }
            100% { transform: translateY(var(--ty, 0)) rotate(var(--rot, 0deg)) translateY(-6px); }
        }

        /* Animasi Lompat Menang */
        @keyframes celebrateJump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        /* State Kalah Total (Rubuh & Tercebur) */
        #game-container.pos-fall #bridge-wrapper {
            animation: bridgeCollapseGhibli 0.7s forwards ease-in;
        }
        #game-container.pos-fall #character {
            animation: charFallGhibli 0.7s forwards ease-in;
        }

        @keyframes bridgeCollapseGhibli {
            0% { transform: rotate(-22deg) translateY(35px); }
            50% { transform: rotate(35deg) translateY(90px); }
            100% { transform: rotate(75deg) translateY(165px); opacity: 0.3; }
        }

        @keyframes charFallGhibli {
            0% { left: 210px; transform: translateY(35px) rotate(-22deg); opacity: 1; }
            40% { left: 230px; transform: translateY(100px) rotate(-50deg); opacity: 1; }
            100% { left: 250px; transform: translateY(185px) scale(0.3) rotate(-90deg); opacity: 0; }
        }

        /* Efek Percikan Air Magis */
        #splash {
            position: absolute;
            bottom: 48px;
            left: 230px;
            width: 85px;
            height: 42px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }
        #game-container.pos-fall #splash {
            animation: splashMagic 0.5s 0.3s forwards ease-out;
        }
        @keyframes splashMagic {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        /* 5. PAPAN SOAL & OPSI JAWABAN */
        #question-board {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            background: linear-gradient(to bottom, #9c6644, #7f4f24);
            border: 4px solid #381d0a;
            padding: 14px 25px;
            border-radius: 14px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.35);
            text-align: center;
            z-index: 20;
        }
        #question-text {
            color: #fffae5;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #scroll-options {
            position: absolute;
            top: 110px;
            right: 45px;
            width: 420px;
            background: #fefae0;
            border: 3px solid #dda15e;
            padding: 25px 20px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            z-index: 20;
        }

        .option-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: 2px solid #bc6c25;
            padding: 11px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            margin-bottom: 10px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #bc6c25;
            color: #ffffff;
            transform: translateX(4px);
        }

        /* Kontrol Bawah */
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #status-msg {
            color: #fffae5;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .reset-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="game-container" class="pos-start">
        <!-- Awan Cat Air Ghibli -->
        <div class="ghibli-cloud gc-1"></div>
        <div class="ghibli-cloud gc-2"></div>

        <!-- Bukit Hijau Teduh & Pohon -->
        <div class="hill-far"></div>
        <div class="hill-near"></div>
        <div class="ghibli-tree gt-1">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>
        <div class="ghibli-tree gt-2">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <!-- Papan Soal di Atas -->
        <div id="question-board">
            <div id="question-text">The tall student studied today. (Pilih jawaban yang benar!)</div>
        </div>

        <!-- Jembatan Lengkung Klasik & Karakter -->
        <div id="bridge-wrapper">
            <div class="classic-arch">
                <div class="arch-deck"></div>
                <div class="arch-rail">
                    <div class="p-post pp1"></div>
                    <div class="p-post pp2"></div>
                    <div class="p-post pp3"></div>
                    <div class="p-post pp4"></div>
                    <div class="p-post pp5"></div>
                </div>
            </div>
        </div>
        <div id="character"></div>
        <div id="splash"></div>

        <!-- Sungai Tenang & Damai -->
        <div class="river-bed">
            <div class="water-wave ww-1"></div>
            <div class="water-wave ww-2"></div>
        </div>

        <!-- Kotak Opsi Jawaban -->
        <div id="scroll-options">
            <button

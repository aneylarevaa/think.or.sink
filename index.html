<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Ghibli Cinematic Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #070b19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTAINER UTAMA --- */
        #game-container {
            position: relative;
            width: 900px;
            height: 550px;
            background: linear-gradient(180deg, #88d4bc 0%, #b4f0dc 60%, #e2fceb 100%);
            border: 6px solid #232924;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        /* 1. AWAN CAT AIR HALUS & BERLAPIS */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 120px;
            filter: blur(0.5px);
            animation: driftCloud linear infinite;
            z-index: 1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }
        .c-1 { width: 180px; height: 50px; top: 30px; left: -200px; animation-duration: 55s; }
        .c-1::before { width: 70px; height: 70px; top: -35px; left: 30px; }
        .c-1::after { width: 90px; height: 90px; top: -50px; left: 80px; }

        .c-2 { width: 130px; height: 40px; top: 95px; left: -250px; animation-duration: 40s; animation-delay: 15s; }
        .c-2::before { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c-2::after { width: 65px; height: 65px; top: -35px; left: 50px; }

        @keyframes driftCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(1200px); }
        }

        /* 2. BUKIT HIJAU & RUMPUT BERTERURAI ESTETIK */
        .hill-back {
            position: absolute;
            bottom: 160px;
            left: -60px;
            width: 1020px;
            height: 280px;
            background: #588157;
            border-radius: 50% 50% 0 0;
            z-index: 2;
            box-shadow: inset 0 20px 20px rgba(0,0,0,0.1);
        }
        .hill-front {
            position: absolute;
            bottom: 120px;
            right: -100px;
            width: 750px;
            height: 250px;
            background: #3a5a40;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }

        /* Pohon Khas Ghibli */
        .tree {
            position: absolute;
            bottom: 210px;
            z-index: 3;
        }
        .trunk {
            width: 20px;
            height: 70px;
            background: #4a3525;
            margin: 0 auto;
            border-radius: 6px;
        }
        .leaves {
            width: 105px;
            height: 115px;
            background: #283618;
            border-radius: 50%;
            position: absolute;
            top: -65px;
            left: -42px;
            box-shadow: inset -12px -12px 0px rgba(0,0,0,0.25);
        }
        .t-left { left: 80px; }
        .t-right { right: 70px; bottom: 250px; transform: scale(0.8); }

        /* 3. SUNGAI TENANG, BERKILAU & ARUS SANGAT HALUS */
        .river-bed {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, #1d6f73 0%, #114b5f 50%, #0b2545 100%);
            z-index: 4;
            overflow: hidden;
            border-top: 4px solid #70af85;
        }

        /* Efek Pantulan Cahaya di Air (Shimmer) */
        .water-shimmer {
            position: absolute;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
        }
        .ws-1 {
            background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 11%);
            background-size: 60px 30px;
            top: 12px;
            animation: flowWater 14s linear infinite;
        }
        .ws-2 {
            background: radial-gradient(circle, rgba(143,243,212,0.3) 8%, transparent 9%);
            background-size: 80px 40px;
            top: 35px;
            animation: flowWater 18s linear infinite reverse;
        }
        @keyframes flowWater {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 4. JEMBATAN KAYU LENGKUNG KLASIK (TRANSISI SUPER MULUS) */
        #bridge-wrapper {
            position: absolute;
            bottom: 82px;
            left: 135px;
            width: 300px;
            height: 120px;
            z-index: 5;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: left bottom;
        }

        .bridge-arch {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .bridge-deck {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75px;
            background: #7f4f24;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            border-top: 6px solid #dda15e;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
        }
        .bridge-rail {
            position: absolute;
            top: -16px;
            width: 100%;
            height: 45px;
            border-top: 5px solid #432818;
        }
        .rail-pillar {
            position: absolute;
            width: 9px;
            height: 50px;
            background: #432818;
            bottom: 0;
            border-radius: 3px;
        }
        .rp1 { left: 15px; }
        .rp2 { left: 88px; height: 58px; top: -8px; }
        .rp3 { left: 150px; height: 62px; top: -12px; }
        .rp4 { left: 212px; height: 58px; top: -8px; }
        .rp5 { left: 280px; }

        /* 5. KARAKTER ANIMASI MULUS (CINEMATIC WALKING & IDLE) */
        #character {
            position: absolute;
            bottom: 95px;
            left: 65px; /* Posisi awal di luar jembatan (kiri) */
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #e76f51, #c84b31);
            border-radius: 18px 18px 6px 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.35);
            z-index: 10;
            /* Transisi pergerakan posisi yang sangat halus dan organik */
            transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #character::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 8px;
            width: 24px;
            height: 24px;
            background: #ffecd1;
            border-radius: 50%;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.1);
        }

        /* Efek Langkah Kaki Berjalan (Bobbing Halus) */
        .walking #character {
            animation: walkBob 0.35s ease-in-out infinite alternate;
        }
        @keyframes walkBob {
            0% { transform: translateY(0) rotate(var(--cRot, 0deg)); }
            100% { transform: translateY(-7px) rotate(calc(var(--cRot, 0deg) - 2deg)); }
        }

        /* --- STATE POSISI BERDASARKAN JAWABAN --- */
        /* Start */
        #game-container.state-start #character {
            left: 65px;
            --cRot: 0deg;
            transform: translateY(0) rotate(0deg);
        }

        /* Step 1 (Salah 1 / Benar 1) */
        #game-container.state-step1 #character {
            left: 135px;
            --cRot: -4deg;
            transform: translateY(-5deg) rotate(-4deg);
        }
        #game-container.state-step1 #bridge-wrapper {
            transform: rotate(-5deg) translateY(8px);
        }

        /* Step 2 (Salah 2) */
        #game-container.state-step2 #character {
            left: 210px;
            --cRot: -12deg;
            transform: translateY(-12deg) rotate(-12deg);
        }
        #game-container.state-step2 #bridge-wrapper {
            transform: rotate(-16deg) translateY(22px);
        }

        /* Win (Sukses Sampai Seberang Kanan) */
        #game-container.state-win #character {
            left: 310px;
            --cRot: 0deg;
            transform: translateY(0) rotate(0deg);
            animation: victoryJump 0.5s ease infinite alternate;
        }
        #game-container.state-win #bridge-wrapper {
            transform: rotate(0deg) translateY(0);
        }
        @keyframes victoryJump {
            0% { transform: translateY(0); }
            100% { transform: translateY(-14px); }
        }

        /* Fall / Kalah Total (Jembatan Rubuh & Tercebur Mulus) */
        #game-container.state-fall #bridge-wrapper {
            animation: bridgeFallAnim 0.75s forwards cubic-bezier(0.55, 0.08, 0.68, 0.53);
        }
        #game-container.state-fall #character {
            animation: charFallAnim 0.75s forwards cubic-bezier(0.55, 0.08, 0.68, 0.53);
        }

        @keyframes bridgeFallAnim {
            0% { transform: rotate(-16deg) translateY(22px); }
            50% { transform: rotate(25deg) translateY(80px); }
            100% { transform: rotate(70deg) translateY(150px); opacity: 0.35; }
        }

        @keyframes charFallAnim {
            0% { left: 210px; transform: translateY(-12deg) rotate(-12deg); opacity: 1; }
            40% { left: 235px; transform: translateY(80px) rotate(-45deg); opacity: 1; }
            100% { left: 260px; transform: translateY(170px) scale(0.35) rotate(-90deg); opacity: 0; }
        }

        /* Efek Cipratan Air Indah */
        #splash-effect {
            position: absolute;
            bottom: 45px;
            left: 240px;
            width: 90px;
            height: 45px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }
        #game-container.state-fall #splash-effect {
            animation: splashBurst 0.6s 0.3s forwards ease-out;
        }
        @keyframes splashBurst {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        /* 6. PAPAN SOAL & OPSI JAWABAN (GAYA KAYU KLASIK HANGAT) */
        #question-board {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            background: linear-gradient(180deg, #9c6644 0%, #7f4f24 100%);
            border: 4px solid #381d0a;
            padding: 14px 25px;
            border-radius: 16px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            text-align: center;
            z-index: 20;
        }
        #question-text {
            color: #fffae5;
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #scroll-options {
            position: absolute;
            top: 110px;
            right: 40px;
            width: 430px;
            background: #fefae0;
            border: 3px solid #dda15e;
            padding: 22px 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 20;
        }

        .option-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: 2px solid #bc6c25;
            padding: 11px 16px;
            font-size: 0.94rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            margin-bottom: 10px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.06);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover {
            background-color: #bc6c25;
            color: #ffffff;
            transform: translateX(6px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        /* Kontrol Bawah */
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #status-msg {
            color: #fffae5;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .reset-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background-color: #bc6c25;
            color: white;
        }
    </style>
</head>
<body>

    <div id="game-container" class="state-start">
        <!-- Awan Cat Air -->
        <div class="cloud c-1"></div>
        <div class="cloud c-2"></div>

        <!-- Bukit Hijau & Pohon -->
        <div class="hill-back"></div>
        <div class="hill-front"></div>
        <div class="tree t-left">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>
        <div class="tree t-right">
            <div class="trunk"></div>
            <div class="leaves"></div>
        </div>

        <!-- Papan Soal -->
        <div id="question-board">
            <div id="question-text">The tall student studied today. (Pilih jawaban yang benar!)</div>
        </div>

        <!-- Jembatan & Karakter -->
        <div id="bridge-wrapper">
            <div class="bridge-arch">
                <div class="bridge-deck"></div>
                <div class="bridge-rail">
                    <div class="rail-pillar rp1"></div>
                    <div class="rail-pillar rp2"></div>
                    <div class="rail-pillar rp3"></div>
                    <div class="rail-pillar rp4"></div>
                    <div class="rail-pillar rp5"></div>
                </div>
            </div>
        </div>
        <div id="character"></div>
        <div id="splash-effect"></div>

        <!-- Sungai Tenang & Shimmer Cahaya -->
        <div class="river-bed">
            <div class="water-shimmer ws-1"></div>
            <div class="water-shimmer ws-2"></div>
        </div>

        <!-- Opsi Jawaban -->
        <div id="scroll-options">
            <button class="option-btn" onclick="playAnim('step1')">A. Salah 1x (Maju selangkah, jembatan bergeser halus)</button>
            <button class="option-btn" onclick="playAnim('step2')">B. Salah 2x (Maju lagi, jembatan miring dramatis)</button>
            <button class="option-btn" onclick="playAnim('win')">C. Benar! (Karakter sukses menyeberang dengan aman)</button>
            <button class="option-btn" onclick="playAnim('fall')">D. Salah 3x (Jembatan rubuh & tercebur sinematik)</button>
        </div>
    </div>

    <!-- Status & Reset -->
    <div id="controls">
        <div id="status-msg">Status: Karakter siap menyeberang. Klik salah satu opsi di atas!</div>
        <button class="reset-btn" onclick="playAnim('start')">Reset Simulasi</button>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const statusMsg = document.getElementById("status-msg");

        function playAnim(action) {
            // Hapus kelas animasi jalan dulu
            container.classList.remove("walking");
            void container.offsetWidth; // Trigger reflow

            if (action === 'start') {
                container.className = "state-start";
                statusMsg.innerText = "Simulasi direset. Karakter kembali ke posisi awal.";
            } else if (action === 'step1') {
                container.className = "state-step1 walking";
                statusMsg.innerText = "❌ Kurang tepat: Karakter berjalan maju, jembatan mulai miring perlahan.";
            } else if (action === 'step2') {
                container.className = "state-step2 walking";
                statusMsg.innerText = "❌ Hampir celaka: Karakter melangkah lagi, jembatan miring tajam!";
            } else if (action === 'win') {
                container.className = "state-win walking";
                statusMsg.innerText = "🎉 Yeay! Karakter berhasil menyeberang jembatan dengan selamat!";
            } else if (action === 'fall') {
                container.className = "state-fall";
                statusMsg.innerText = "💥 Jembatan patah dan rubuh! Karakter tercebur dengan mulus ke sungai.";
            }
        }
    </script>
</body>
</html>

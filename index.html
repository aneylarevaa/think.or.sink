<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Game Edukasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #070b19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 562px;
            background: url('background-river.gif') no-repeat center center;
            background-size: cover;
            border: 4px solid #283618;
            border-radius: 14px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* ELEMEN JEMBATAN DI TENGAH SUNGAI */
        #bridge-img {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            z-index: 5;
            transition: all 0.3s ease;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-50%) scale(0.95); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .animate-board {
            animation: popIn 0.3s ease-out forwards;
        }

        /* Papan Kayu Atas (Soal) */
        #wooden-sign {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 460px;
            height: 120px;
            background: url('papan-soal-bersih.png') no-repeat center center;
            background-size: contain;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 45px 5px 45px;
            text-align: center;
            z-index: 10;
        }
        #question-text {
            color: #38220f;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
            line-height: 1.3;
        }

        /* Kertas Gulungan Bawah (Opsi Jawaban) */
        #scroll-options {
            position: absolute;
            top: 165px;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 330px;
            background: url('kertas-opsi.png') no-repeat center center;
            background-size: contain;
            padding: 55px 40px 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }

        .option-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #fceade;
            color: #38220f;
            border: 2px solid #b08968;
            padding: 9px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #dda15e;
            color: #ffffff;
            transform: translateX(4px);
        }

        #controls {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }
        #status-msg {
            color: #fffae5;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .reset-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
        .reset-btn:hover { background-color: #bc6c25; color: white; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Gambar Jembatan (Berubah tiap salah jawab) -->
        <img id="bridge-img" src="bridge-1.png" alt="Jembatan">

        <div id="wooden-sign" class="animate-board">
            <div id="question-text">Memuat soal dari SheetDB...</div>
        </div>
        <div id="scroll-options" class="animate-board"></div>
    </div>

    <div id="controls">
        <div id="status-msg">Status: Menghubungkan ke SheetDB...</div>
        <button class="reset-btn" onclick="initGame()">Muat Ulang Game</button>
    </div>

    <script>
        const SPREADSHEET_API_URL = "https://sheetdb.io/api/v1/sf6lawxbra0x6";

        let questions = [];
        let currentIndex = 0;
        let wrongAttempts = 0; 
        
        const woodenSign = document.getElementById("wooden-sign");
        const questionText = document.getElementById("question-text");
        const scrollOptions = document.getElementById("scroll-options");
        const statusMsg = document.getElementById("status-msg");
        const bridgeImg = document.getElementById("bridge-img");

        async function initGame() {
            statusMsg.innerText = "Mengambil data soal dari SheetDB...";
            currentIndex = 0;
            wrongAttempts = 0;
            updateBridgeImage();

            try {
                const response = await fetch(SPREADSHEET_API_URL);
                const data = await response.json();
                
                questions = data.map(row => ({
                    question: row.question,
                    options: [row.optionA, row.optionB, row.optionC, row.optionD],
                    answer: String(row.correctAnswer).trim()
                }));

                if (questions.length > 0) {
                    loadQuestion();
                    statusMsg.innerText = "Status: Silakan jawab pertanyaan di atas!";
                } else {
                    questionText.innerText = "Tidak ada soal ditemukan di SheetDB.";
                }
            } catch (error) {
                console.error("Gagal memuat API SheetDB:", error);
                statusMsg.innerText = "⚠ Gagal memuat data dari SheetDB. Periksa koneksi/nama kolom.";
            }
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                triggerTransition();
                questionText.innerText = "🎉 Luar Biasa! Kamu berhasil menyelesaikan semua pertanyaan!";
                scrollOptions.innerHTML = `<button class="option-btn" onclick="initGame()">Mainkan Lagi Dari Awal</button>`;
                statusMsg.innerText = "Status: Selesai!";
                return;
            }

            const q = questions[currentIndex];
            triggerTransition();

            questionText.innerText = `(${currentIndex + 1}/${questions.length}) ${q.question}`;
            scrollOptions.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                scrollOptions.appendChild(btn);
            });
        }

        function triggerTransition() {
            woodenSign.classList.remove("animate-board");
            scrollOptions.classList.remove("animate-board");
            
            void woodenSign.offsetWidth; 
            void scrollOptions.offsetWidth;

            woodenSign.classList.add("animate-board");
            scrollOptions.classList.add("animate-board");
        }

        function updateBridgeImage() {
            if (wrongAttempts === 0) bridgeImg.src = "bridge-1.png";
            else if (wrongAttempts === 1) bridgeImg.src = "bridge-2.png";
            else if (wrongAttempts === 2) bridgeImg.src = "bridge-3.png";
            else {
                bridgeImg.src = "bridge-4.png";
            }
        }

        function checkAnswer(selected, correct) {
            const isCorrect = (selected.trim().toLowerCase() === correct.toLowerCase());

            if (isCorrect) {
                currentIndex++;
                statusMsg.innerText = "✨ Benar! Jembatan aman, lanjut ke soal berikutnya...";
                setTimeout(() => loadQuestion(), 500);
            } else {
                wrongAttempts++;
                updateBridgeImage();

                if (wrongAttempts >= 3) {
                    triggerTransition();
                    questionText.innerText = "💥 Oh tidak! Jembatan keburu roboh karena terlalu banyak salah jawab!";
                    scrollOptions.innerHTML = `<button class="option-btn" onclick="initGame()">Coba Lagi Dari Awal</button>`;
                    statusMsg.innerText = "Status: Game Over!";
                } else {
                    statusMsg.innerText = `❌ Kurang tepat! Jembatan mulai rusak (Kesalahan ke-${wrongAttempts}/3)`;
                }
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>

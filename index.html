<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Aesthetic Edition</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTAINER UTAMA GAME --- */
        #game-container {
            position: relative;
            width: 900px;
            height: 550px;
            background: linear-gradient(to bottom, #74ebd5, #ACB6E5); /* Langit cerah estetik */
            border: 6px solid #3b2219;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* 1. AWAN BERGERAK CANTIK DI LANGIT */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 100px;
            animation: moveCloud linear infinite;
            z-index: 1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }
        .c1 { width: 120px; height: 40px; top: 40px; left: -150px; animation-duration: 35s; }
        .c1::before { width: 50px; height: 50px; top: -25px; left: 20px; }
        .c1::after { width: 70px; height: 70px; top: -40px; left: 50px; }

        .c2 { width: 90px; height: 30px; top: 100px; left: -200px; animation-duration: 25s; animation-delay: 10s; }
        .c2::before { width: 40px; height: 40px; top: -20px; left: 15px; }
        .c2::after { width: 50px; height: 50px; top: -30px; left: 35px; }

        @keyframes moveCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(1100px); }
        }

        /* 2. PADANG RUMPUT & BUKIT LATAR BELAKANG */
        .hill-back {
            position: absolute;
            bottom: 150px;
            left: -50px;
            width: 1000px;
            height: 300px;
            background: #a3d977;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }
        .hill-front {
            position: absolute;
            bottom: 130px;
            right: -100px;
            width: 700px;
            height: 250px;
            background: #85cb33;
            border-radius: 50% 50% 0 0;
            z-index: 2;
        }

        /* Pohon Dekorasi Estetik */
        .tree {
            position: absolute;
            bottom: 220px;
            z-index: 3;
        }
        .tree-trunk {
            width: 16px;
            height: 60px;
            background: #8b5a2b;
            margin: 0 auto;
            border-radius: 4px;
        }
        .tree-leaves {
            width: 80px;
            height: 90px;
            background: #386641;
            border-radius: 50%;
            position: absolute;
            top: -50px;
            left: -32px;
            box-shadow: inset -8px -8px 0px rgba(0,0,0,0.15);
        }
        .tree-left { left: 100px; }
        .tree-right { right: 80px; bottom: 250px; transform: scale(0.8); }

        /* 3. SUNGAI & OMBAK KECIL BERGELOMBANG CANTIK */
        .river-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, #3b82f6, #1e40af);
            z-index: 4;
            overflow: hidden;
            border-top: 4px solid #93c5fd;
        }

        /* Efek Gelombang Berlapis Murni CSS */
        .wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background-repeat: repeat-x;
        }
        .wave-1 {
            background: radial-gradient(circle, #60a5fa 10%, transparent 11%);
            background-size: 30px 15px;
            top: 5px;
            opacity: 0.6;
            animation: waveAnim1 4s linear infinite;
        }
        .wave-2 {
            background: radial-gradient(circle, #93c5fd 10%, transparent 11%);
            background-size: 40px 20px;
            top: 15px;
            opacity: 0.4;
            animation: waveAnim2 6s linear infinite;
        }
        @keyframes waveAnim1 {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes waveAnim2 {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        /* 4. JEMBATAN LENGKUNG KAYU CANTIK (CSS VECTOR) */
        #bridge-wrapper {
            position: absolute;
            bottom: 85px;
            left: 140px;
            width: 280px;
            height: 110px;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left bottom;
        }

        .arch-bridge {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        /* Badan jembatan melengkung */
        .bridge-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: #a0522d;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            border-top: 6px solid #d4a373;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
        /* Tiang & pagar silang jembatan lengkung */
        .bridge-rail {
            position: absolute;
            top: -15px;
            width: 100%;
            height: 40px;
            border-top: 5px solid #8b4513;
        }
        .rail-post {
            position: absolute;
            width: 8px;
            height: 45px;
            background: #8b4513;
            bottom: 0;
        }
        .p1 { left: 10px; }
        .p2 { left: 80px; height: 52px; top: -7px; }
        .p3 { left: 140px; height: 55px; top: -10px; }
        .p4 { left: 200px; height: 52px; top: -7px; }
        .p5 { left: 262px; }

        /* Karakter di atas jembatan */
        #character {
            position: absolute;
            bottom: 95px;
            left: 210px;
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 18px 18px 6px 6px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            z-index: 10;
            transition: all 0.5s ease;
            animation: characterIdle 2s ease-in-out infinite;
        }
        #character::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 8px;
            width: 24px;
            height: 24px;
            background: #fecdd3;
            border-radius: 50%;
        }

        @keyframes characterIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* --- STAGE KERUSAKAN JEMBATAN --- */
        #bridge-wrapper.stage-1 {
            transform: rotate(-6deg) translateY(10px);
        }
        #bridge-wrapper.stage-1 #character {
            transform: translateY(10px) rotate(-6deg);
            animation: none;
        }

        #bridge-wrapper.stage-2 {
            transform: rotate(-22deg) translateY(35px);
        }
        #bridge-wrapper.stage-2 #character {
            transform: translateY(35px) rotate(-22deg);
            animation: panicShake 0.25s infinite;
        }
        @keyframes panicShake {
            0%, 100% { transform: translateY(35px) rotate(-22deg) translateX(0); }
            50% { transform: translateY(35px) rotate(-22deg) translateX(-3px); }
        }

        #bridge-wrapper.stage-3 {
            animation: bridgeCollapse 0.7s forwards ease-in;
        }
        #bridge-wrapper.stage-3 #character {
            animation: characterFall 0.7s forwards ease-in;
        }

        @keyframes bridgeCollapse {
            0% { transform: rotate(-22deg) translateY(35px); }
            50% { transform: rotate(35deg) translateY(90px); }
            100% { transform: rotate(75deg) translateY(160px); opacity: 0.4; }
        }

        @keyframes characterFall {
            0% { transform: translateY(35px) rotate(-22deg); opacity: 1; }
            40% { transform: translateY(100px) rotate(-50deg); opacity: 1; }
            100% { transform: translateY(180px) scale(0.3) rotate(-90deg); opacity: 0; }
        }

        /* Efek Percikan Air (Splash) */
        #splash {
            position: absolute;
            bottom: 50px;
            left: 260px;
            width: 80px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }
        #bridge-wrapper.stage-3 ~ #splash {
            animation: splashAnim 0.5s 0.3s forwards ease-out;
        }
        @keyframes splashAnim {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        /* 5. PAPAN SOAL & KERTAS OPSI JAWABAN */
        #question-board {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            background: linear-gradient(to bottom, #b86b30, #8a4718);
            border: 4px solid #4a2511;
            padding: 14px 25px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            text-align: center;
            z-index: 20;
        }
        #question-text {
            color: #ffffff;
            font-family: 'Fredoka', cursive;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        #scroll-options {
            position: absolute;
            top: 110px;
            right: 45px;
            width: 420px;
            background: #fdf6e2;
            border: 3px solid #d4a373;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            z-index: 20;
        }

        .option-btn {
            font-family: 'Lexend', sans-serif;
            background-color: #f4a261;
            color: #ffffff;
            border: 2px solid #e76f51;
            padding: 11px 16px;
            font-size: 0.92rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            margin-bottom: 10px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            transition: all 0.2s;
        }
        .option-btn:hover {
            background-color: #e76f51;
            transform: translateX(4px);
        }

        /* Kontrol Bawah */
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #status-msg {
            color: #f1faee;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .reset-btn {
            font-family: 'Lexend', sans-serif;
            background-color: #e76f51;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Awan Bergerak di Langit -->
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <!-- Bukit & Pohon Latar Belakang -->
        <div class="hill-back"></div>
        <div class="hill-front"></div>
        <div class="tree tree-left">
            <div class="tree-trunk"></div>
            <div class="tree-leaves"></div>
        </div>
        <div class="tree tree-right">
            <div class="tree-trunk"></div>
            <div class="tree-leaves"></div>
        </div>

        <!-- Papan Soal di Atas -->
        <div id="question-board">
            <div id="question-text">The tall student studied today. (Pilih jawaban yang benar!)</div>
        </div>

        <!-- Jembatan Lengkung Kayu Custom & Karakter -->
        <div id="bridge-wrapper" class="stage-0">
            <div class="arch-bridge">
                <div class="bridge-body"></div>
                <div class="bridge-rail">
                    <div class="rail-post p1"></div>
                    <div class="rail-post p2"></div>
                    <div class="rail-post p3"></div>
                    <div class="rail-post p4"></div>
                    <div class="rail-post p5"></div>
                </div>
            </div>
        </div>
        <div id="character"></div>
        <div id="splash"></div>

        <!-- Sungai dengan Gelombang Air Bergelombang -->
        <div class="river-container">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
        </div>

        <!-- Kotak Opsi Jawaban di Kanan -->
        <div id="scroll-options">
            <button class="option-btn" onclick="triggerStage(1)">A. The tall student studied today.</button>
            <button class="option-btn" onclick="triggerStage(2)">B. The big boy bought a book.</button>
            <button class="option-btn" onclick="triggerWin()">C. My friend visited the museum.</button>
            <button class="option-btn" onclick="triggerStage(3)">D. The young girl likes music.</button>
        </div>
    </div>

    <!-- Informasi Status Simulasi -->
    <div id="controls">
        <div id="status-msg">Status: Siap! Klik opsi jawaban untuk tes animasi jembatan.</div>
        <button class="reset-btn" onclick="resetSim()">Reset Simulasi</button>
    </div>

    <script>
        const bridgeWrapper = document.getElementById("bridge-wrapper");
        const statusMsg = document.getElementById("status-msg");

        function triggerStage(stageNum) {
            if (stageNum === 1) {
                bridgeWrapper.className = "stage-1";
                statusMsg.innerText = "❌ Salah 1x: Jembatan lengkung mulai bergeser!";
            } else if (stageNum === 2) {
                bridgeWrapper.className = "stage-2";
                statusMsg.innerText = "❌ Salah 2x: Jembatan miring parah dan karakter panik!";
            } else if (stageNum === 3) {
                bridgeWrapper.className = "stage-3";
                statusMsg.innerText = "💥 Salah 3x: Jembatan rubuh total & karakter tercebur ke sungai!";
            }
        }

        function triggerWin() {
            bridgeWrapper.className = "stage-0";
            statusMsg.innerText = "🎉 Benar! Karakter berhasil menyeberang dengan aman!";
        }

        function resetSim() {
            bridgeWrapper.className = "stage-0";
            statusMsg.innerText = "Simulasi direset ke posisi awal.";
        }
    </script>
</body>
</html>

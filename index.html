<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Animated Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #070b19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* CONTAINER UTAMA GAME */
        #game-container {
            position: relative;
            width: 1000px;
            height: 562px;
            /* Ganti 'background-river.jpg' dengan nama file gambar pemandangan kamu */
            background: url('background-river.jpg') no-repeat center center;
            background-size: cover;
            border: 4px solid #283618;
            border-radius: 14px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* ================= ANIMASI AWAN BERGERAK ================= */
        .moving-clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 40%;
            /* Gunakan gambar overlay awan transparan atau efek gradasi bergerak */
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            animation: driftClouds 25s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes driftClouds {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0%); }
        }

        /* ================= ANIMASI AIR MENGIKUTI ARUS ================= */
        .flowing-water {
            position: absolute;
            /* Sesuaikan posisi area sungai berdasarkan gambarmu */
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            /* Efek kilau air bergeser / riak */
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.25) 0%, rgba(0,0,0,0) 70%);
            background-size: 200px 100px;
            animation: flowRiver 4s linear infinite;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        @keyframes flowRiver {
            0% { background-position: 0 0; }
            100% { background-position: -200px 0; }
        }

        /* PAPAN KAYU ATAS (SOAL) */
        #wooden-sign {
            position: absolute;
            top: 45px;
            left: 56%;
            transform: translateX(-50%);
            width: 440px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            text-align: center;
            z-index: 10;
        }
        #question-text {
            color: #fffae5;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            text-shadow: 2px 2px 3px rgba(0,0,0,0.7);
            line-height: 1.3;
        }

        /* GULUNGAN KERTAS TENGAH (OPSI JAWABAN) */
        #scroll-options {
            position: absolute;
            top: 200px;
            left: 425px;
            width: 480px;
            height: 290px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }

        .option-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #fceade;
            color: #38220f;
            border: 2px solid #b08968;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #dda15e;
            color: #ffffff;
            transform: translateX(4px);
        }

        /* KONTROL BAWAH */
        #controls {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }
        #status-msg {
            color: #fffae5;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .reset-btn {
            font-family: 'Quicksand', sans-serif;
            background-color: #dda15e;
            color: #283618;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }
        .reset-btn:hover { background-color: #bc6c25; color: white; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Efek Animasi Awan & Air -->
        <div class="moving-clouds"></div>
        <div class="flowing-water"></div>

        <!-- Papan Kayu Atas (Soal) -->
        <div id="wooden-sign">
            <div id="question-text">Memuat soal dari Google Spreadsheet...</div>
        </div>

        <!-- Area Gulungan Kertas Tengah (Opsi Jawaban) -->
        <div id="scroll-options"></div>
    </div>

    <div id="controls">
        <div id="status-msg">Status: Menghubungkan ke Spreadsheet API...</div>
        <button class="reset-btn" onclick="initGame()">Muat Ulang Game</button>
    </div>

    <script>
        const SPREADSHEET_API_URL = "URL_GOOGLE_SPREADSHEET_API_KAMU_DISINI";

        let questions = [];
        let currentIndex = 0;
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("scroll-options");
        const statusMsg = document.getElementById("status-msg");

        async function initGame() {
            statusMsg.innerText = "Mengambil data soal dari Spreadsheet...";
            currentIndex = 0;

            try {
                const response = await fetch(SPREADSHEET_API_URL);
                const data = await response.json();
                
                questions = data.log ? data : data.map(row => ({
                    question: row[0],
                    options: [row[1], row[2], row[3], row[4]],
                    answer: String(row[5]).trim()
                }));

                if (questions.length > 0) {
                    loadQuestion();
                    statusMsg.innerText = "Status: Silakan jawab pertanyaan di atas!";
                } else {
                    questionText.innerText = "Tidak ada soal ditemukan di Spreadsheet.";
                }
            } catch (error) {
                console.error("Gagal memuat API:", error);
                // Mode Simulasi Cadangan
                questions = [
                    { question: "Apa bahasa Inggris dari 'Kucing'?", options: ["Dog", "Cat", "Bird", "Fish"], answer: "Cat" },
                    { question: "Manakah bentuk past tense dari 'Go'?", options: ["Gone", "Going", "Went", "Goed"], answer: "Went" }
                ];
                loadQuestion();
                statusMsg.innerText = "⚠ Menggunakan Mode Simulasi (Ganti SPREADSHEET_API_URL).";
            }
        }

        function loadQuestion() {
            if (currentIndex >= questions.length) {
                questionText.innerText = "🎉 Luar Biasa! Kamu berhasil menyelesaikan semua pertanyaan!";
                optionsContainer.innerHTML = `<button class="option-btn" onclick="initGame()">Mainkan Lagi Dari Awal</button>`;
                statusMsg.innerText = "Status: Selesai!";
                return;
            }

            const q = questions[currentIndex];
            questionText.innerText = `(${currentIndex + 1}/${questions.length}) ${q.question}`;
            optionsContainer.innerHTML = "";

            q.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            const isCorrect = (selected.trim().toLowerCase() === correct.toLowerCase());

            if (isCorrect) {
                currentIndex++;
                statusMsg.innerText = "✨ Benar! Melanjutkan ke soal berikutnya...";
                setTimeout(() => loadQuestion(), 700);
            } else {
                statusMsg.innerText = "❌ Kurang tepat, coba lagi ya!";
                setTimeout(() => loadQuestion(), 700);
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- Area Jembatan & Karakter yang beranimasi -->
        <div id="bridge-area" class="stage-0">
            <!-- Elemen Jembatan (bisa berupa gambar/div asset Canva kamu) -->
            <div class="bridge-structure"></div>
            
            <!-- Karakter -->
            <div id="character"></div>

            <!-- Efek Cipratan Air saat jatuh di stage 3 -->
            <div id="splash-effect"></div>
        </div>
    </div>

    <!-- Kotak Pertanyaan & Opsi -->
    <div id="quiz-container">
        <div id="question-text">Memuat pertanyaan...</div>
        <div id="options-container"></div>
        <button id="restart-btn" style="display: none;">Coba Lagi</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think or Sink - Interactive Bridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #1a252f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- CONTAINER UTAMA & BACKGROUND ANIMASI (AWAN & AIR) --- */
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #70dbdb, #e0f7f7);
            border: 4px solid #2c3e50;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* Animasi Awan di Latar Belakang */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            animation: moveClouds linear infinite;
        }
        .cloud-1 { width: 120px; height: 40px; top: 40px; left: -150px; animation-duration: 25s; }
        .cloud-2 { width: 90px; height: 30px; top: 90px; left: -100px; animation-duration: 18s; animation-delay: 5s; }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(1000px); }
        }

        /* Area Air di Bawah dengan Efek Berkilau/Mengalir */
        .water-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, #2980b9, #1f618d);
            overflow: hidden;
        }
        .water-wave {
            position: absolute;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            animation: waveMove 4s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50px); }
        }

        /* --- JEMBATAN DAN KARAKTER DENGAN SISTEM STAGE --- */
        #bridge-area {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: all 0.5s ease-in-out;
        }

        /* Desain Visual Jembatan Kayu */
        .bridge-structure {
            position: absolute;
            bottom: 110px;
            left: 150px;
            width: 500px;
            height: 25px;
            background: #8b4513;
            border: 3px solid #5c2c16;
            border-radius: 4px;
            box-shadow: 0 5px 0 #4a2211;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Tali Penyangga Jembatan */
        .bridge-rope {
            position: absolute;
            bottom: 130px;
            left: 170px;
            width: 460px;
            height: 4px;
            background: #d4ac0d;
            border-radius: 2px;
            transition: all 0.5s ease-in-out;
        }

        /* Karakter (Orang-orangan / Avatar) */
        #character {
            position: absolute;
            bottom: 135px;
            left: 350px;
            width: 40px;
            height: 60px;
            background: #e74c3c;
            border-radius: 20px 20px 5px 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.5s ease-in-out;
            z-index: 10;
        }
        #character::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 10px;
            width: 20px;
            height: 20px;
            background: #f5b041;
            border-radius: 50%;
        }

        /* --- EFEK PERUBAHAN STAGE KETIKA SALAH JAWAB --- */

        /* STAGE 1: Tali Copot Sebelah (Jembatan miring awal) */
        #bridge-area.stage-1 .bridge-rope {
            transform: rotate(-8deg) translateY(10px);
            opacity: 0.5;
            border-style: dashed;
        }
        #bridge-area.stage-1 .bridge-structure {
            transform: rotate(-6deg) translateY(12px);
        }
        #bridge-area.stage-1 #character {
            transform: translateY(12px) rotate(-6deg);
        }

        /* STAGE 2: Kayu Retak / Miring Parah */
        #bridge-area.stage-2 .bridge-rope {
            opacity: 0; /* Tali putus total */
        }
        #bridge-area.stage-2 .bridge-structure {
            transform: rotate(-18deg) translateY(35px);
            filter: drop-shadow(2px 5px 0px rgba(0,0,0,0.5));
            border-color: #3e1b0c;
            background: repeating-linear-gradient(45deg, #8b4513, #8b4513 10px, #6e350f 10px, #6e350f 20px);
        }
        #bridge-area.stage-2 #character {
            transform: translateY(35px) rotate(-18deg);
        }

        /* STAGE 3: Jembatan Rubuh & Karakter Tercebur */
        #bridge-area.stage-3 .bridge-structure {
            animation: bridgeCollapseAnim 0.7s forwards ease-in;
        }
        #bridge-area.stage-3 #character {
            animation: characterFallAnim 0.7s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53);
        }

        @keyframes bridgeCollapseAnim {
            0% { transform: rotate(-18deg) translateY(35px); }
            50% { transform: rotate(35deg) translateY(90px); }
            100% { transform: rotate(75deg) translateY(150px); opacity: 0.7; }
        }

        @keyframes characterFallAnim {
            0% { transform: translateY(35px) rotate(-18deg); opacity: 1; }
            40% { transform: translateY(100px) rotate(-40deg); opacity: 1; }
            100% { transform: translateY(180px) scale(0.4) rotate(-90deg); opacity: 0; }
        }

        /* Efek Cipratan Air (Splash) */
        #splash-effect {
            position: absolute;
            bottom: 80px;
            left: 360px;
            width: 80px;
            height: 40px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 15;
        }
        #bridge-area.stage-3 #splash-effect {
            animation: splashAnim 0.5s 0.3s forwards ease-out;
        }

        @keyframes splashAnim {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* --- UI KONTROL & SOAL --- */
        #ui-panel {
            margin-top: 20px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            width: 800px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        #question-text {
            color: #2c3e50;
            font-family: 'Fredoka', cursive;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            font-family: 'Lexend', sans-serif;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn:hover { background-color: #2980b9; }

        #status-msg {
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 24px;
            color: #e67e22;
        }

        #controls {
            margin-top: 10px;
        }

        .action-btn {
            font-family: 'Lexend', sans-serif;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .action-btn:hover { background-color: #219653; }
    </style>
</head>
<body>

    <!-- Area Game Utama -->
    <div id="game-container">
        <!-- Awan Bergerak -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <!-- Jembatan & Karakter dengan Stage Animasi -->
        <div id="bridge-area" class="stage-0">
            <div class="bridge-rope"></div>
            <div class="bridge-structure"></div>
            <div id="character"></div>
            <div id="splash-effect"></div>
        </div>

        <!-- Air di Bawah -->
        <div class="water-container">
            <div class="water-wave"></div>
        </div>
    </div>

    <!-- Panel Soal & Interaksi -->
    <div id="ui-panel">
        <div id="question-text">Contoh Pertanyaan: Apa warna langit saat cerah?</div>
        <div id="options-container">
            <button class="option-btn" onclick="testWrong()">A. Hijau (Salah)</button>
            <button class="option-btn" onclick="testWrong()">B. Ungu (Salah)</button>
            <button class="option-btn" onclick="testCorrect()">C. Biru (Benar)</button>
            <button class="option-btn" onclick="testWrong()">D. Hitam (Salah)</button>
        </div>
        <div id="status-msg">Silakan coba klik tombol jawaban salah untuk melihat animasi jembatan!</div>
        <div id="controls">
            <button class="action-btn" onclick="resetGame()">Reset Simulasi</button>
        </div>
    </div>

    <script>
        let wrongCount = 0;
        const bridgeArea = document.getElementById("bridge-area");
        const statusMsg = document.getElementById("status-msg");

        function testWrong() {
            wrongCount++;
            if (wrongCount === 1) {
                bridgeArea.className = "stage-1";
                statusMsg.innerText = "❌ Salah 1x: Tali jembatan mulai copot sebelah!";
            } else if (wrongCount === 2) {
                bridgeArea.className = "stage-2";
                statusMsg.innerText = "❌ Salah 2x: Tali putus total, kayu jembatan retak dan miring!";
            } else if (wrongCount >= 3) {
                bridgeArea.className = "stage-3";
                statusMsg.innerText = "💥 Salah 3x: Jembatan rubuh seketika dan karakter tercebur ke air!";
            }
        }

        function testCorrect() {
            statusMsg.innerText = "🎉 Benar! Karakter aman terselamatkan di seberang!";
        }

        function resetGame() {
            wrongCount = 0;
            bridgeArea.className = "stage-0";
            statusMsg.innerText = "Simulasi direset. Silakan coba lagi!";
        }
    </script>
</body>
</html>
